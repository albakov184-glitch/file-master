name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: file-master:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests inside the image
        run: |
          docker run --rm --user root -v "$PWD:/src" -w /src file-master:ci sh -c "
            apt-get update -qq && apt-get install -y -qq redis-server >/dev/null &&
            pip install -q pytest==9.2.0 &&
            python -m pytest -q"
